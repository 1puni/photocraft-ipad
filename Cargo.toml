[package]
name = "photocraft-ipad"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
egui = "=0.36.2"
serde_json = "1"
photocraft-ui-egui = { path = "../photocraft/crates/ui-egui" }
photocraft-doc = { path = "../photocraft/crates/doc" }
photocraft-color = { path = "../photocraft/crates/color" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
photocraft-web = { path = "../photocraft/apps/photocraft-web", features = ["heif"] }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "PointerEvent", "DomRect", "Event"] }

[dev-dependencies]
photocraft-engine = { path = "../photocraft/crates/engine" }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
[profile.release]
lto = "thin"
codegen-units = 1
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
[profile.wasm-release.package."*"]
opt-level = "s"
[profile.wasm-release.package.photocraft-raster]
opt-level = 3
[profile.wasm-release.package.photocraft-color]
opt-level = 3
[profile.wasm-release.package.photocraft-cms]
opt-level = 3
[profile.wasm-release.package.photocraft-compose]
opt-level = 3
[profile.wasm-release.package.photocraft-algo]
opt-level = 3
[profile.wasm-release.package.photocraft-paint]
opt-level = 3
